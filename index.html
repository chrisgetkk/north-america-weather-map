<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North America Live Weather Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #0f172a; 
            color: #e2e8f0;
            height: 100vh;
            overflow: hidden;
        }
        #map { width: 100%; height: 100%; background: #0f172a; }
        
        .control-panel {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px 16px;
            width: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-height: 92vh;
            overflow-y: auto;
        }
        .control-panel h2 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #38bdf8;
            font-weight: 600;
        }
        .control-group {
            margin-bottom: 12px;
        }
        .control-group label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 500;
        }
        select, button {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #1e293b;
            color: #f1f5f9;
            font-size: 13px;
            cursor: pointer;
        }
        select:hover, button:hover { border-color: #38bdf8; }
        button {
            background: #0ea5e9;
            border-color: #0ea5e9;
            font-weight: 600;
            margin-top: 4px;
        }
        button:hover { background: #0284c7; }
        button.secondary {
            background: #334155;
            border-color: #475569;
        }
        button.secondary:hover { background: #475569; }
        
        .btn-row {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }
        .btn-row button { flex: 1; }
        
        .status {
            font-size: 11px;
            color: #64748b;
            margin-top: 12px;
            line-height: 1.45;
            border-top: 1px solid #334155;
            padding-top: 10px;
        }
        .status span { color: #22c55e; }
        
        .alert-box {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            border-radius: 8px;
            padding: 8px 10px;
            margin-top: 10px;
            font-size: 12px;
            max-height: 140px;
            overflow-y: auto;
        }
        .alert-box strong { color: #f87171; }
        .alert-item {
            margin-bottom: 6px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(239,68,68,0.2);
        }
        .alert-item:last-child { border-bottom: none; margin-bottom: 0; }
        
        .temp-marker {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #38bdf8;
            border-radius: 50%;
            color: #fff;
            font-weight: 700;
            font-size: 12px;
            text-align: center;
            line-height: 30px;
            width: 34px !important;
            height: 34px !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .temp-marker.hot  { border-color: #ef4444; background: rgba(127, 29, 29, 0.92); }
        .temp-marker.warm { border-color: #f97316; }
        .temp-marker.cool { border-color: #3b82f6; }
        .temp-marker.cold { border-color: #06b6d4; background: rgba(8, 47, 73, 0.92); }
        
        .city-label {
            background: transparent;
            border: none;
            color: #e2e8f0;
            font-weight: 600;
            font-size: 11px;
            text-shadow: 0 0 4px #000, 0 0 4px #000, 1px 1px 2px #000;
            white-space: nowrap;
        }
        .city-label.major {
            font-size: 13px;
            font-weight: 700;
            color: #f8fafc;
        }
        
        .legend {
            position: absolute;
            bottom: 22px;
            left: 12px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 7px 12px;
            font-size: 11px;
            color: #94a3b8;
        }
        
        .leaflet-control-attribution {
            background: rgba(15, 23, 42, 0.85) !important;
            color: #64748b !important;
            font-size: 10px !important;
        }
        .leaflet-control-attribution a { color: #38bdf8 !important; }
        
        .radar-time {
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="control-panel">
        <h2>🌤 Live Weather Map</h2>
        
        <div class="control-group">
            <label>Satellite Layer</label>
            <select id="satSelect">
                <option value="none">None</option>
                <option value="visible">Visible (Day Clouds)</option>
                <option value="infrared">Infrared (Cloud Tops)</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Radar Overlay</label>
            <select id="radarSelect">
                <option value="on" selected>On</option>
                <option value="off">Off</option>
            </select>
            
            <div class="btn-row">
                <button id="playBtn" class="secondary">▶ Play Loop</button>
                <button id="pauseBtn" class="secondary">⏸ Pause</button>
            </div>
            <div class="radar-time" id="radarTime">Radar: —</div>
        </div>
        
        <div class="control-group">
            <label>Temperature Markers</label>
            <select id="tempSelect">
                <option value="on" selected>On (NWS Live)</option>
                <option value="off">Off</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Weather Alerts</label>
            <select id="alertSelect">
                <option value="on" selected>On (NWS)</option>
                <option value="off">Off</option>
            </select>
        </div>
        
        <button id="refreshBtn">↻ Refresh All Data Now</button>
        
        <div id="alertBox" class="alert-box" style="display:none;"></div>
        
        <div class="status">
            <div>Temps: <span id="tempStatus">Loading...</span></div>
            <div>Radar: <span id="radarStatus">Loading...</span></div>
            <div>Alerts: <span id="alertStatus">Loading...</span></div>
            <div>Last update: <span id="lastUpdate">—</span></div>
            <div style="margin-top:8px;font-size:10px;color:#475569;">
                Free data: NWS + RainViewer + Esri + Iowa State<br>
                Future-proof: Edit the CONFIG section in the code.
            </div>
        </div>
    </div>
    
    <div class="legend">
        Zoom in for more cities • Click temp circles for details
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        {id:"KBOI", name:"Boise", lat:43.56, lon:-116.22},
        {id:"KBIL", name:"Billings", lat:45.81, lon:-108.54},
        {id:"KGEG", name:"Spokane", lat:47.62, lon:-117.53},
        {id:"KFSD", name:"Sioux Falls", lat:43.58, lon:-96.74},
        {id:"KFAR", name:"Fargo", lat:46.92, lon:-96.82}
    ];
    
    let map, cityLayerGroup, tempLayerGroup, alertLayerGroup;
    let radarLayer = null;
    let satLayer = null;
    let radarFrames = [];
    let currentFrameIndex = 0;
    let radarPlaying = false;
    let radarTimer = null;
    let rainviewerHost = "https://tilecache.rainviewer.com";
    
    function initMap() {
        map = L.map('map', {
            center: CONFIG.defaultCenter,
            zoom: CONFIG.defaultZoom,
            minZoom: CONFIG.minZoom,
            maxZoom: CONFIG.maxZoom
        });
        
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 19
        }).addTo(map);
        
        cityLayerGroup = L.layerGroup().addTo(map);
        tempLayerGroup = L.layerGroup().addTo(map);
        alertLayerGroup = L.layerGroup().addTo(map);
        
        updateCityLabels();
        map.on('zoomend', updateCityLabels);
        
        document.getElementById('satSelect').addEventListener('change', updateSatellite);
        document.getElementById('radarSelect').addEventListener('change', () => {
            if (document.getElementById('radarSelect').value === 'off') {
                stopRadarLoop();
                if (radarLayer) { map.removeLayer(radarLayer); radarLayer = null; }
                document.getElementById('radarStatus').textContent = 'Off';
                document.getElementById('radarTime').textContent = 'Radar: Off';
            } else {
                loadRadarFrames(true);
            }
        });
        document.getElementById('tempSelect').addEventListener('change', () => {
            if (document.getElementById('tempSelect').value === 'on') fetchTemperatures();
            else { tempLayerGroup.clearLayers(); document.getElementById('tempStatus').textContent = 'Off'; }
        });
        document.getElementById('alertSelect').addEventListener('change', () => {
            if (document.getElementById('alertSelect').value === 'on') fetchAlerts();
            else { 
                alertLayerGroup.clearLayers(); 
                document.getElementById('alertBox').style.display = 'none';
                document.getElementById('alertStatus').textContent = 'Off'; 
            }
        });
        
        document.getElementById('playBtn').addEventListener('click', startRadarLoop);
        document.getElementById('pauseBtn').addEventListener('click', stopRadarLoop);
        document.getElementById('refreshBtn').addEventListener('click', () => {
            fetchTemperatures();
            loadRadarFrames(true);
            fetchAlerts();
            updateSatellite();
        });
        
        fetchTemperatures();
        loadRadarFrames(true);
        fetchAlerts();
        updateSatellite();
        
        setInterval(fetchTemperatures, CONFIG.tempRefreshMs);
        setInterval(() => loadRadarFrames(false), CONFIG.radarRefreshMs);
        setInterval(fetchAlerts, CONFIG.alertRefreshMs);
    }
    
    function updateCityLabels() {
        cityLayerGroup.clearLayers();
        const zoom = map.getZoom();
        CITIES.forEach(city => {
            if (city.tier === 1 || (city.tier === 2 && zoom >= 6)) {
                const icon = L.divIcon({
                    className: 'city-label' + (city.tier === 1 ? ' major' : ''),
                    html: city.name,
                    iconSize: [0, 0],
                    iconAnchor: [0, 0]
                });
                L.marker([city.lat, city.lon], {icon: icon, interactive: false}).addTo(cityLayerGroup);
            }
        });
    }
    
    async function fetchTemperatures() {
        if (document.getElementById('tempSelect').value !== 'on') return;
        
        document.getElementById('tempStatus').textContent = 'Updating...';
        tempLayerGroup.clearLayers();
        let success = 0;
        
        const promises = STATIONS.map(async (station) => {
            try {
                const resp = await fetch(`https://api.weather.gov/stations/${station.id}/observations/latest`, {
                    headers: { 'User-Agent': CONFIG.userAgent, 'Accept': 'application/geo+json' }
                });
                if (!resp.ok) return null;
                const data = await resp.json();
                const props = data.properties;
                if (!props || props.temperature.value === null) return null;
                
                const tempC = props.temperature.value;
                const tempF = Math.round(tempC * 9/5 + 32);
                return { station, tempF, tempC: Math.round(tempC), timestamp: props.timestamp, text: props.textDescription || '' };
            } catch(e) { return null; }
        });
        
        const results = await Promise.all(promises);
        results.forEach(r => {
            if (!r) return;
            success++;
            let cls = 'temp-marker';
            if (r.tempF >= 90) cls += ' hot';
            else if (r.tempF >= 70) cls += ' warm';
            else if (r.tempF >= 40) cls += ' cool';
            else cls += ' cold';
            
            const icon = L.divIcon({ className: cls, html: r.tempF + '°', iconSize: [34, 34], iconAnchor: [17, 17] });
            L.marker([r.station.lat, r.station.lon], {icon})
                .bindPopup(`<strong>${r.station.name}</strong><br>${r.tempF}°F (${r.tempC}°C)<br>${r.text}<br><small>${new Date(r.timestamp).toLocaleString()}</small>`)
                .addTo(tempLayerGroup);
        });
        
        document.getElementById('tempStatus').textContent = success + ' stations';
        document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
    }
    
    async function loadRadarFrames(forceShow = false) {
        if (document.getElementById('radarSelect').value !== 'on') return;
        
        try {
            const resp = await fetch('https://api.rainviewer.com/public/weather-maps.json');
            const api = await resp.json();
            
            if (!api.radar || !api.radar.past || api.radar.past.length === 0) {
                document.getElementById('radarStatus').textContent = 'No data';
                return;
            }
            
            rainviewerHost = api.host || rainviewerHost;
            radarFrames = api.radar.past.slice(-CONFIG.radarFramesToKeep);
            
            currentFrameIndex = radarFrames.length - 1;
            showRadarFrame(currentFrameIndex);
            
            document.getElementById('radarStatus').textContent = radarFrames.length + ' frames';
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
        } catch(e) {
            console.error(e);
            document.getElementById('radarStatus').textContent = 'Error';
        }
    }
    
    function showRadarFrame(index) {
        if (!radarFrames.length) return;
        index = Math.max(0, Math.min(index, radarFrames.length - 1));
        currentFrameIndex = index;
        
        const frame = radarFrames[index];
        const url = rainviewerHost + frame.path + '/256/{z}/{x}/{y}/2/1_1.png';
        
        if (radarLayer) map.removeLayer(radarLayer);
        
        radarLayer = L.tileLayer(url, {
            opacity: CONFIG.radarOpacity,
            zIndex: 200,
            maxNativeZoom: 7,
            maxZoom: 12
        }).addTo(map);
        
        const timeStr = new Date(frame.time * 1000).toLocaleTimeString();
        document.getElementById('radarTime').textContent = 'Radar: ' + timeStr;
        document.getElementById('radarStatus').textContent = (index + 1) + '/' + radarFrames.length;
    }
    
    function startRadarLoop() {
        if (radarPlaying || radarFrames.length < 2) return;
        radarPlaying = true;
        document.getElementById('playBtn').style.opacity = '0.5';
        
        radarTimer = setInterval(() => {
            currentFrameIndex = (currentFrameIndex + 1) % radarFrames.length;
            showRadarFrame(currentFrameIndex);
        }, 700);
    }
    
    function stopRadarLoop() {
        radarPlaying = false;
        if (radarTimer) clearInterval(radarTimer);
        radarTimer = null;
        document.getElementById('playBtn').style.opacity = '1';
    }
    
    async function fetchAlerts() {
        if (document.getElementById('alertSelect').value !== 'on') return;
        
        document.getElementById('alertStatus').textContent = 'Updating...';
        alertLayerGroup.clearLayers();
        
        try {
            const resp = await fetch('https://api.weather.gov/alerts/active?status=actual&message_type=alert', {
                headers: { 'User-Agent': CONFIG.userAgent, 'Accept': 'application/geo+json' }
            });
            if (!resp.ok) throw new Error('Alert fetch failed');
            const data = await resp.json();
            
            const features = data.features || [];
            let shown = 0;
            
            const important = features.filter(f => {
                const event = (f.properties.event || '').toLowerCase();
                return event.includes('warning') || event.includes('watch') || 
                       event.includes('tornado') || event.includes('severe') ||
                       event.includes('hurricane') || event.includes('blizzard');
            }).slice(0, 40);
            
            important.forEach(f => {
                try {
                    if (!f.geometry) return;
                    const props = f.properties;
                    const color = (props.event || '').toLowerCase().includes('warning') ? '#ef4444' : '#f59e0b';
                    
                    const layer = L.geoJSON(f.geometry, {
                        style: { color: color, weight: 2, opacity: 0.8, fillOpacity: 0.15 }
                    }).bindPopup(`<strong>${props.event}</strong><br>${props.headline || ''}<br><small>${props.areaDesc || ''}</small>`);
                    
                    layer.addTo(alertLayerGroup);
                    shown++;
                } catch(e) {}
            });
            
            const box = document.getElementById('alertBox');
            if (important.length > 0) {
                box.style.display = 'block';
                box.innerHTML = '<strong>Active Alerts</strong><br>' + 
                    important.slice(0, 8).map(f => 
                        `<div class="alert-item">${f.properties.event}<br><small>${(f.properties.areaDesc || '').substring(0, 60)}...</small></div>`
                    ).join('');
            } else {
                box.style.display = 'none';
            }
            
            document.getElementById('alertStatus').textContent = shown + ' shown';
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
        } catch(e) {
            console.error(e);
            document.getElementById('alertStatus').textContent = 'Error';
        }
    }
    
    function updateSatellite() {
        const choice = document.getElementById('satSelect').value;
        if (satLayer) { map.removeLayer(satLayer); satLayer = null; }
        if (choice === 'none') return;
        
        let wmsUrl, layers;
        if (choice === 'visible') {
            wmsUrl = 'https://mesonet.agron.iastate.edu/cgi-bin/wms/goes/conus_vis.cgi?';
            layers = 'conus_vis_1km';
        } else {
            wmsUrl = 'https://mesonet.agron.iastate.edu/cgi-bin/wms/goes/conus_ir.cgi?';
            layers = 'conus_ir_4km';
        }
        
        satLayer = L.tileLayer.wms(wmsUrl, {
            layers: layers,
            format: 'image/png',
            transparent: true,
            opacity: CONFIG.satelliteOpacity,
            attribution: 'Satellite © Iowa State / NOAA GOES',
            zIndex: 100
        }).addTo(map);
    }
    
    document.addEventListener('DOMContentLoaded', initMap);
    </script>
</body>
