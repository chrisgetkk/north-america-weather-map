<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Weather Map</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #0f172a; color: #e2e8f0; height: 100vh; overflow: hidden;
        }
        #map { width: 100%; height: 100%; background: #0f172a; }
        
        .control-panel {
            position: absolute; top: 12px; right: 12px; z-index: 1000;
            background: rgba(15, 23, 42, 0.96); border: 1px solid #334155;
            border-radius: 12px; width: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-height: 92vh; overflow: hidden;
            transition: all 0.25s ease;
        }
        .control-panel.minimized { width: 52px; height: 52px; }
        .control-panel.minimized .panel-content { display: none !important; }
        .control-panel.minimized .panel-title { display: none !important; }
        .control-panel.minimized .panel-header {
            justify-content: center; padding: 0; height: 52px; border-bottom: none;
        }
        
        .panel-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 14px 8px 14px;
            border-bottom: 1px solid #334155;
            background: rgba(15, 23, 42, 0.9);
            cursor: pointer;
        }
        .panel-title { font-size: 15px; color: #38bdf8; font-weight: 600; }
        
        .toggle-btn {
            background: #1e293b; border: 1px solid #475569; color: #e2e8f0;
            font-size: 20px; font-weight: bold; cursor: pointer;
            width: 36px; height: 36px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            line-height: 1; transition: all 0.2s; flex-shrink: 0;
        }
        .toggle-btn:hover { background: #334155; border-color: #38bdf8; color: #38bdf8; }
        
        .panel-content {
            padding: 12px 14px 14px 14px;
            max-height: calc(92vh - 55px); overflow-y: auto;
        }
        
        .control-group { margin-bottom: 12px; }
        .control-group label {
            display: block; font-size: 12px; color: #94a3b8;
            margin-bottom: 4px; font-weight: 500;
        }
        select, button.action-btn {
            width: 100%; padding: 8px 10px; border-radius: 6px;
            border: 1px solid #475569; background: #1e293b;
            color: #f1f5f9; font-size: 13px; cursor: pointer;
        }
        select:hover, button.action-btn:hover { border-color: #38bdf8; }
        button.action-btn {
            background: #0ea5e9; border-color: #0ea5e9; font-weight: 600; margin-top: 4px;
        }
        button.action-btn:hover { background: #0284c7; }
        button.secondary {
            background: #334155; border-color: #475569; color: #f1f5f9;
            padding: 8px 10px; border-radius: 6px; border: 1px solid #475569;
            font-size: 13px; cursor: pointer; width: 100%;
        }
        button.secondary:hover { background: #475569; }
        .btn-row { display: flex; gap: 6px; margin-top: 6px; }
        .btn-row button { flex: 1; }
        
        .status {
            font-size: 11px; color: #64748b; margin-top: 12px; line-height: 1.45;
            border-top: 1px solid #334155; padding-top: 10px;
        }
        .status span { color: #22c55e; }
        
        .alert-box {
            background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444;
            border-radius: 8px; padding: 8px 10px; margin-top: 10px;
            font-size: 12px; max-height: 110px; overflow-y: auto;
        }
        .alert-box strong { color: #f87171; }
        .alert-item { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid rgba(239,68,68,0.2); }
        .alert-item:last-child { border-bottom: none; margin-bottom: 0; }
        
        .temp-marker {
            background: rgba(15, 23, 42, 0.9); border: 2px solid #38bdf8; border-radius: 50%;
            color: #fff; font-weight: 700; font-size: 12px; text-align: center;
            line-height: 30px; width: 34px !important; height: 34px !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .temp-marker.hot  { border-color: #ef4444; background: rgba(127, 29, 29, 0.92); }
        .temp-marker.warm { border-color: #f97316; }
        .temp-marker.cool { border-color: #3b82f6; }
        .temp-marker.cold { border-color: #06b6d4; background: rgba(8, 47, 73, 0.92); }
        
        .city-label {
            background: transparent; border: none; color: #e2e8f0; font-weight: 600;
            font-size: 11px; text-shadow: 0 0 4px #000, 0 0 4px #000, 1px 1px 2px #000; white-space: nowrap;
        }
        .city-label.major { font-size: 13px; font-weight: 700; color: #f8fafc; }
        
        .legend {
            position: absolute; bottom: 22px; left: 12px; z-index: 1000;
            background: rgba(15, 23, 42, 0.9); border: 1px solid #334155;
            border-radius: 8px; padding: 7px 12px; font-size: 11px; color: #94a3b8;
        }
        .time-legend {
            position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
            z-index: 1000;
            background: rgba(15, 23, 42, 0.92); border: 1px solid #334155;
            border-radius: 8px; padding: 6px 14px; font-size: 12px; color: #e2e8f0;
            display: flex; gap: 18px; white-space: nowrap;
        }
        .time-legend span { color: #38bdf8; }
        
        .leaflet-control-attribution {
            background: rgba(15, 23, 42, 0.85) !important; color: #64748b !important; font-size: 10px !important;
        }
        .leaflet-control-attribution a { color: #38bdf8 !important; }
        .radar-time { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 4px; }
        
        .obs-popup { font-size: 13px; line-height: 1.45; min-width: 220px; }
        .obs-popup h3 { margin: 0 0 6px 0; font-size: 15px; color: #0f172a; }
        .obs-popup .row { display: flex; justify-content: space-between; gap: 12px; margin: 2px 0; }
        .obs-popup .label { color: #64748b; }
        .obs-popup .value { font-weight: 600; color: #0f172a; }
        .obs-popup .wx { margin-top: 6px; padding-top: 6px; border-top: 1px solid #e2e8f0; font-style: italic; }
        
        @media (max-width: 700px) {
            .control-panel { width: 280px; top: 8px; right: 8px; }
            .time-legend { font-size: 11px; gap: 10px; padding: 5px 10px; }
            .legend { display: none; }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="control-panel" id="controlPanel">
        <div class="panel-header" id="panelHeader">
            <div class="panel-title">🌤 Live Weather Map</div>
            <button class="toggle-btn" id="toggleBtn" title="Minimize menu">−</button>
        </div>
        
        <div class="panel-content" id="panelContent">
            <div class="control-group">
                <label>Satellite Layer</label>
                <select id="satSelect">
                    <option value="none">None</option>
                    <optgroup label="GOES-East (US)">
                        <option value="goes_visible">Visible</option>
                        <option value="goes_shortwave">Shortwave IR</option>
                        <option value="goes_watervapor">Water Vapor</option>
                        <option value="goes_infrared">Infrared</option>
                    </optgroup>
                    <optgroup label="Global">
                        <option value="global_infrared">Global Infrared (best effort)</option>
                    </optgroup>
                </select>
            </div>
            
            <div class="control-group">
                <label>Radar Overlay</label>
                <select id="radarSelect">
                    <option value="on" selected>On</option>
                    <option value="off">Off</option>
                </select>
                <div class="btn-row">
                    <button id="playBtn" class="secondary">▶ Play</button>
                    <button id="pauseBtn" class="secondary">⏸ Pause</button>
                </div>
                <label style="margin-top:8px;">Radar Speed</label>
                <select id="radarSpeed">
                    <option value="400">Fast</option>
                    <option value="550" selected>Normal</option>
                    <option value="800">Slow</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Temperature Markers</label>
                <select id="tempSelect">
                    <option value="on" selected>On (Smart / View-based)</option>
                    <option value="off">Off</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Weather Alerts</label>
                <select id="alertSelect">
                    <option value="on" selected>On (NWS)</option>
                    <option value="off">Off</option>
                </select>
            </div>
            
            <button id="refreshBtn" class="action-btn">↻ Refresh All Data</button>
            
            <div id="alertBox" class="alert-box" style="display:none;"></div>
            
            <div class="status">
                <div>Temps: <span id="tempStatus">Loading...</span></div>
                <div>Radar: <span id="radarStatus">Loading...</span></div>
                <div>Satellite: <span id="satStatus">—</span></div>
                <div>Alerts: <span id="alertStatus">Loading...</span></div>
                <div>Last update: <span id="lastUpdate">—</span></div>
            </div>
        </div>
    </div>
    
    <div class="legend">Click temp circles for full observation details</div>
    <div class="time-legend">
        <div>Radar: <span id="radarTimeLabel">—</span></div>
        <div>Satellite: <span id="satTimeLabel">—</span></div>
    </div>

    let map, cityLayerGroup, tempLayerGroup, alertLayerGroup;
    let radarLayerA = null, radarLayerB = null, activeRadar = "A", satLayer = null;
    let radarFrames = [], currentFrameIndex = 0, radarPlaying = false, radarTimer = null;
    let rainviewerHost = "https://tilecache.rainviewer.com";
    let tempFetchTimeout = null;
    let panelMinimized = false;

    function initMap() {
        map = L.map('map', {
            center: CONFIG.defaultCenter, zoom: CONFIG.defaultZoom,
            minZoom: CONFIG.minZoom, maxZoom: CONFIG.maxZoom
        });

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri', maxZoom: 19
        }).addTo(map);

        cityLayerGroup = L.layerGroup().addTo(map);
        tempLayerGroup = L.layerGroup().addTo(map);
        alertLayerGroup = L.layerGroup().addTo(map);

        updateCityLabels();
        map.on('zoomend moveend', () => {
            updateCityLabels();
            if (tempFetchTimeout) clearTimeout(tempFetchTimeout);
            tempFetchTimeout = setTimeout(fetchTemperaturesForView, 700);
        });

        document.getElementById('toggleBtn').addEventListener('click', function(e) {
            e.preventDefault(); e.stopPropagation(); togglePanel();
        });
        document.getElementById('panelHeader').addEventListener('click', function(e) {
            if (panelMinimized) { e.preventDefault(); togglePanel(); }
        });

        document.getElementById('satSelect').addEventListener('change', loadSatellite);
        document.getElementById('radarSelect').addEventListener('change', () => {
            if (document.getElementById('radarSelect').value === 'off') {
                stopRadarLoop();
                if (radarLayerA) { map.removeLayer(radarLayerA); radarLayerA = null; }
                if (radarLayerB) { map.removeLayer(radarLayerB); radarLayerB = null; }
                activeRadar = 'A';
                document.getElementById('radarStatus').textContent = 'Off';
                document.getElementById('radarTimeLabel').textContent = 'Off';
            } else loadRadarFrames();
        });
        document.getElementById('tempSelect').addEventListener('change', () => {
            if (document.getElementById('tempSelect').value === 'on') fetchTemperaturesForView();
            else { tempLayerGroup.clearLayers(); document.getElementById('tempStatus').textContent = 'Off'; }
        });
        document.getElementById('alertSelect').addEventListener('change', () => {
            if (document.getElementById('alertSelect').value === 'on') fetchAlerts();
            else {
                alertLayerGroup.clearLayers();
                document.getElementById('alertBox').style.display = 'none';
                document.getElementById('alertStatus').textContent = 'Off';
            }
        });

        document.getElementById('playBtn').addEventListener('click', startRadarLoop);
        document.getElementById('pauseBtn').addEventListener('click', stopRadarLoop);
        document.getElementById('refreshBtn').addEventListener('click', () => {
            fetchTemperaturesForView(); loadRadarFrames(); fetchAlerts(); loadSatellite();
        });

        fetchTemperaturesForView();
        loadRadarFrames();
        fetchAlerts();
        loadSatellite();

        setInterval(fetchTemperaturesForView, CONFIG.tempRefreshMs);
        setInterval(loadRadarFrames, CONFIG.radarRefreshMs);
        setInterval(fetchAlerts, CONFIG.alertRefreshMs);
    }

    function togglePanel() {
        const panel = document.getElementById('controlPanel');
        const btn = document.getElementById('toggleBtn');
        panelMinimized = !panelMinimized;
        if (panelMinimized) {
            panel.classList.add('minimized');
            btn.textContent = '+';
            btn.title = 'Expand menu';
        } else {
            panel.classList.remove('minimized');
            btn.textContent = '−';
            btn.title = 'Minimize menu';
        }
    }

    function updateCityLabels() {
        cityLayerGroup.clearLayers();
        CITIES.forEach(city => {
            const icon = L.divIcon({
                className: 'city-label major', html: city.name, iconSize: [0,0], iconAnchor: [0,0]
            });
            L.marker([city.lat, city.lon], {icon, interactive:false}).addTo(cityLayerGroup);
        });
    }

    function windText(deg, speedKt) {
        if (speedKt == null || isNaN(speedKt)) return '—';
        const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
        const idx = (deg == null || isNaN(deg)) ? null : Math.round(((deg % 360) / 22.5)) % 16;
        const dir = idx == null ? '' : dirs[idx] + ' ';
        const mph = Math.round(speedKt * 1.15078);
        return `${dir}${Math.round(speedKt)} kt (${mph} mph)`;
    }

    // NWS windSpeed is m/s (unitCode wmoUnit:m_s-1). Convert to knots.
    function nwsMsToKt(ms) {
        if (ms == null || isNaN(ms)) return null;
        return ms * 1.94384;
    }

    function buildUSPopup(r) {
        const p = r.props || {};
        const dewF = p.dewpoint?.value != null ? Math.round(p.dewpoint.value * 9/5 + 32) : null;
        const dewC = p.dewpoint?.value != null ? Math.round(p.dewpoint.value) : null;
        const rh = p.relativeHumidity?.value != null ? Math.round(p.relativeHumidity.value) : null;
        const windDeg = p.windDirection?.value;
        // NWS values are m/s
        const windKt = nwsMsToKt(p.windSpeed?.value);
        const windGustKt = nwsMsToKt(p.windGust?.value);
        const visMi = p.visibility?.value != null ? (p.visibility.value / 1609.34).toFixed(1) : null;
        const altIn = p.barometricPressure?.value != null ? (p.barometricPressure.value / 3386.39).toFixed(2) : null;
        const wx = p.textDescription || '';
        let html = `<div class="obs-popup"><h3>${r.station.name}</h3>
            <div class="row"><span class="label">Temperature</span><span class="value">${r.tempF}°F (${r.tempC}°C)</span></div>`;
        if (dewF != null) html += `<div class="row"><span class="label">Dew Point</span><span class="value">${dewF}°F (${dewC}°C)</span></div>`;
        if (rh != null) html += `<div class="row"><span class="label">Humidity</span><span class="value">${rh}%</span></div>`;
        html += `<div class="row"><span class="label">Wind</span><span class="value">${windText(windDeg, windKt)}</span></div>`;
        if (windGustKt) html += `<div class="row"><span class="label">Gusts</span><span class="value">${Math.round(windGustKt)} kt</span></div>`;
        if (visMi) html += `<div class="row"><span class="label">Visibility</span><span class="value">${visMi} mi</span></div>`;
        if (altIn) html += `<div class="row"><span class="label">Pressure</span><span class="value">${altIn} in</span></div>`;
        if (wx) html += `<div class="wx">${wx}</div>`;
        html += `<div style="margin-top:6px;font-size:11px;color:#64748b;">${new Date(r.timestamp).toLocaleString()}</div></div>`;
        return html;
    }

    function buildWorldPopup(r) {
        let html = `<div class="obs-popup"><h3>${r.station.name}</h3>
            <div class="row"><span class="label">Temperature</span><span class="value">${r.tempF}°F (${r.tempC}°C)</span></div>`;
        if (r.dewF != null) html += `<div class="row"><span class="label">Dew Point</span><span class="value">${r.dewF}°F (${r.dewC}°C)</span></div>`;
        if (r.rh != null) html += `<div class="row"><span class="label">Humidity</span><span class="value">${r.rh}%</span></div>`;
        if (r.windDir != null) html += `<div class="row"><span class="label">Wind</span><span class="value">${windText(r.windDir, r.windKt)}</span></div>`;
        if (r.wx) html += `<div class="wx">${r.wx}</div>`;
        html += `<div style="margin-top:6px;font-size:11px;color:#64748b;">${r.time || ''}</div></div>`;
        return html;
    }

    function weatherCodeText(code) {
        const map = {0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',80:'Showers',95:'Thunderstorm'};
        return map[code] || '';
    }

    async function fetchTemperaturesForView() {
        if (document.getElementById('tempSelect').value !== 'on') return;
        document.getElementById('tempStatus').textContent = 'Updating...';
        tempLayerGroup.clearLayers();

        const bounds = map.getBounds().pad(0.25);
        let usCandidates = US_STATIONS.filter(s => bounds.contains([s.lat, s.lon]));
        let worldCandidates = WORLD_STATIONS.filter(s => bounds.contains([s.lat, s.lon]));

        if (usCandidates.length + worldCandidates.length > CONFIG.maxTempsToFetch) {
            const center = map.getCenter();
            usCandidates.sort((a,b) => Math.hypot(a.lat-center.lat,a.lon-center.lng) - Math.hypot(b.lat-center.lat,b.lon-center.lng));
            worldCandidates.sort((a,b) => Math.hypot(a.lat-center.lat,a.lon-center.lng) - Math.hypot(b.lat-center.lat,b.lon-center.lng));
            usCandidates = usCandidates.slice(0, 80);
            worldCandidates = worldCandidates.slice(0, 30);
        }

        let success = 0;
        const usPromises = usCandidates.map(async (station) => {
            try {
                const resp = await fetch(`https://api.weather.gov/stations/${station.id}/observations/latest`, {
                    headers: { 'User-Agent': CONFIG.userAgent, 'Accept': 'application/geo+json' }
                });
                if (!resp.ok) return null;
                const data = await resp.json();
                const props = data.properties;
                if (!props || props.temperature?.value == null) return null;
                const tempC = props.temperature.value;
                return { type:'us', station, tempF: Math.round(tempC*9/5+32), tempC: Math.round(tempC), timestamp: props.timestamp, props };
            } catch(e) { return null; }
        });

        const worldPromises = worldCandidates.map(async (station) => {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${station.lat}&longitude=${station.lon}&current=temperature_2m,relative_humidity_2m,dew_point_2m,weather_code,wind_speed_10m,wind_direction_10m&wind_speed_unit=kn&timezone=auto`;
                const resp = await fetch(url);
                if (!resp.ok) return null;
                const data = await resp.json();
                const c = data.current;
                if (!c || c.temperature_2m == null) return null;
                const tempC = c.temperature_2m;
                const dewC = c.dew_point_2m != null ? Math.round(c.dew_point_2m) : null;
                return {
                    type:'world', station,
                    tempF: Math.round(tempC*9/5+32), tempC: Math.round(tempC),
                    dewF: dewC != null ? Math.round(dewC*9/5+32) : null, dewC,
                    rh: c.relative_humidity_2m != null ? Math.round(c.relative_humidity_2m) : null,
                    windDir: c.wind_direction_10m, windKt: c.wind_speed_10m,
                    wx: weatherCodeText(c.weather_code), time: c.time
                };
            } catch(e) { return null; }
        });

        const results = await Promise.all([...usPromises, ...worldPromises]);
        results.forEach(r => {
            if (!r) return;
            success++;
            let cls = 'temp-marker';
            if (r.tempF >= 90) cls += ' hot';
            else if (r.tempF >= 70) cls += ' warm';
            else if (r.tempF >= 40) cls += ' cool';
            else cls += ' cold';
            const icon = L.divIcon({ className: cls, html: r.tempF + '°', iconSize: [34,34], iconAnchor: [17,17] });
            const popupHtml = r.type === 'us' ? buildUSPopup(r) : buildWorldPopup(r);
            L.marker([r.station.lat, r.station.lon], {icon}).bindPopup(popupHtml, {maxWidth:280}).addTo(tempLayerGroup);
        });

        document.getElementById('tempStatus').textContent = success + ' in view';
        document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
    }

    async function loadRadarFrames() {
        if (document.getElementById('radarSelect').value !== 'on') return;
        try {
            const resp = await fetch('https://api.rainviewer.com/public/weather-maps.json');
            const api = await resp.json();
            rainviewerHost = api.host || rainviewerHost;
            if (!api.radar?.past?.length) {
                document.getElementById('radarStatus').textContent = 'No data';
                return;
            }
            radarFrames = api.radar.past.slice(-CONFIG.radarFramesToKeep);
            currentFrameIndex = radarFrames.length - 1;
            showRadarFrame(currentFrameIndex);
            document.getElementById('radarStatus').textContent = radarFrames.length + ' frames';
        } catch(e) {
            document.getElementById('radarStatus').textContent = 'Error';
        }
    }

    function radarUrl(frame) {
        return rainviewerHost + frame.path + '/256/{z}/{x}/{y}/2/1_1.png';
    }

    function ensureRadarLayers() {
        // Create two reusable layers once; swap opacity/visibility instead of destroy/recreate
        if (!radarLayerA) {
            radarLayerA = L.tileLayer('', { opacity: 0, zIndex: 200, maxNativeZoom: 7, maxZoom: 12 });
            radarLayerB = L.tileLayer('', { opacity: 0, zIndex: 201, maxNativeZoom: 7, maxZoom: 12 });
            radarLayerA.addTo(map);
            radarLayerB.addTo(map);
        }
    }

    function preloadRadarTiles(index) {
        if (!radarFrames.length) return;
        const frame = radarFrames[((index % radarFrames.length) + radarFrames.length) % radarFrames.length];
        // Hint browser to fetch a center tile; full viewport tiles still load via Leaflet
        const img = new Image();
        img.src = rainviewerHost + frame.path + '/256/5/8/12/2/1_1.png';
    }

    function showRadarFrame(index) {
        if (!radarFrames.length) return;
        index = Math.max(0, Math.min(index, radarFrames.length - 1));
        currentFrameIndex = index;
        const frame = radarFrames[index];
        ensureRadarLayers();

        const nextLayer = activeRadar === 'A' ? radarLayerB : radarLayerA;
        const currLayer = activeRadar === 'A' ? radarLayerA : radarLayerB;

        nextLayer.setUrl(radarUrl(frame));
        // Mild crossfade
        nextLayer.setOpacity(0);
        setTimeout(() => {
            nextLayer.setOpacity(CONFIG.radarOpacity);
            currLayer.setOpacity(0);
        }, 40);
        activeRadar = activeRadar === 'A' ? 'B' : 'A';

        // Preload a couple frames ahead
        preloadRadarTiles(index + 1);
        preloadRadarTiles(index + 2);

        const t = new Date(frame.time * 1000).toLocaleTimeString();
        document.getElementById('radarTimeLabel').textContent = t;
        document.getElementById('radarStatus').textContent = (index+1) + '/' + radarFrames.length;
    }

    function getRadarSpeedMs() {
        const el = document.getElementById('radarSpeed');
        const v = el ? parseInt(el.value, 10) : 550;
        return isNaN(v) ? 550 : v;
    }

    function startRadarLoop() {
        if (radarPlaying || radarFrames.length < 2) return;
        radarPlaying = true;
        document.getElementById('playBtn').style.opacity = '0.5';
        const tick = () => {
            if (!radarPlaying) return;
            currentFrameIndex = (currentFrameIndex + 1) % radarFrames.length;
            showRadarFrame(currentFrameIndex);
            radarTimer = setTimeout(tick, getRadarSpeedMs());
        };
        radarTimer = setTimeout(tick, getRadarSpeedMs());
    }

    function stopRadarLoop() {
        radarPlaying = false;
        if (radarTimer) {
            clearTimeout(radarTimer);
            clearInterval(radarTimer);
        }
        radarTimer = null;
        document.getElementById('playBtn').style.opacity = '1';
    }

    function loadSatellite() {
        const choice = document.getElementById('satSelect').value;
        if (satLayer) { map.removeLayer(satLayer); satLayer = null; }

        if (choice === 'none') {
            document.getElementById('satStatus').textContent = 'Off';
            document.getElementById('satTimeLabel').textContent = '—';
            return;
        }

        if (choice === 'global_infrared') {
            // Best-effort global IR from RainViewer
            fetch('https://api.rainviewer.com/public/weather-maps.json')
                .then(r => r.json())
                .then(api => {
                    const frames = api.satellite?.infrared || [];
                    if (!frames.length) {
                        document.getElementById('satStatus').textContent = 'Unavailable';
                        document.getElementById('satTimeLabel').textContent = 'No data';
                        return;
                    }
                    const frame = frames[frames.length - 1];
                    const host = api.host || rainviewerHost;
                    satLayer = L.tileLayer(host + frame.path + '/256/{z}/{x}/{y}/0/0_0.png', {
                        opacity: CONFIG.satelliteOpacity, zIndex: 100, maxNativeZoom: 7, maxZoom: 10
                    }).addTo(map);
                    const t = frame.time ? new Date(frame.time * 1000).toLocaleTimeString() : 'Latest';
                    document.getElementById('satTimeLabel').textContent = t;
                    document.getElementById('satStatus').textContent = 'Global IR';
                })
                .catch(() => {
                    document.getElementById('satStatus').textContent = 'Error';
                    document.getElementById('satTimeLabel').textContent = 'Error';
                });
            return;
        }

        // GOES-East single reliable frame
        const channelMap = {
            goes_visible: 'conus_ch02',
            goes_shortwave: 'conus_ch07',
            goes_watervapor: 'conus_ch09',
            goes_infrared: 'conus_ch13'
        };
        const layer = channelMap[choice];
        if (!layer) return;

        satLayer = L.tileLayer.wms('https://mesonet.agron.iastate.edu/cgi-bin/wms/goes_east.cgi?', {
            layers: layer, format: 'image/png', transparent: true,
            opacity: CONFIG.satelliteOpacity, attribution: 'GOES-East © Iowa State / NOAA', zIndex: 100
        }).addTo(map);

        document.getElementById('satTimeLabel').textContent = 'GOES latest';
        document.getElementById('satStatus').textContent = 'US GOES';
    }

    async function fetchAlerts() {
        if (document.getElementById('alertSelect').value !== 'on') return;
        document.getElementById('alertStatus').textContent = 'Updating...';
        alertLayerGroup.clearLayers();
        try {
            const resp = await fetch('https://api.weather.gov/alerts/active?status=actual&message_type=alert', {
                headers: { 'User-Agent': CONFIG.userAgent, 'Accept': 'application/geo+json' }
            });
            if (!resp.ok) throw new Error('fail');
            const data = await resp.json();
            const features = data.features || [];
            const important = features.filter(f => {
                const e = (f.properties.event || '').toLowerCase();
                return e.includes('warning') || e.includes('watch') || e.includes('tornado') || e.includes('severe') || e.includes('hurricane');
            }).slice(0, 40);

            let shown = 0;
            important.forEach(f => {
                try {
                    if (!f.geometry) return;
                    const props = f.properties;
                    const color = (props.event || '').toLowerCase().includes('warning') ? '#ef4444' : '#f59e0b';
                    L.geoJSON(f.geometry, {
                        style: { color, weight: 2, opacity: 0.8, fillOpacity: 0.15 }
                    }).bindPopup(`<strong>${props.event}</strong><br>${props.headline || ''}<br><small>${props.areaDesc || ''}</small>`)
                      .addTo(alertLayerGroup);
                    shown++;
                } catch(e) {}
            });

            const box = document.getElementById('alertBox');
            if (important.length > 0) {
                box.style.display = 'block';
                box.innerHTML = '<strong>Active Alerts</strong><br>' +
                    important.slice(0, 5).map(f =>
                        `<div class="alert-item">${f.properties.event}<br><small>${(f.properties.areaDesc||'').substring(0,50)}...</small></div>`
                    ).join('');
            } else box.style.display = 'none';

            document.getElementById('alertStatus').textContent = shown + ' shown';
        } catch(e) {
            document.getElementById('alertStatus').textContent = 'Error';
        }
    }

    document.addEventListener('DOMContentLoaded', initMap);
    </script>
</body>
</html>
