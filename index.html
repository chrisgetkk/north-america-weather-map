<!DOCTYPE html>

        #map { width: 100%; height: 100%; background: #0f172a; }
        
        .control-panel {
            position: absolute; top: 12px; right: 12px; z-index: 1000;

            border-radius: 12px; width: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-height: 92vh; overflow: hidden;
            transition: all 0.25s ease;
        }
        .control-panel.minimized {
            width: 52px;
            height: 52px;
        }
        .control-panel.minimized .panel-content {
            display: none !important;
        }
        .control-panel.minimized .panel-title {
            display: none !important;
        }
        .control-panel.minimized .panel-header {
            justify-content: center;
            padding: 0;
            height: 52px;
            border-bottom: none;
        }
        
        .panel-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 14px 8px 14px;
            border-bottom: 1px solid #334155;
            background: rgba(15, 23, 42, 0.9);
            cursor: pointer;
        }
        .panel-title { font-size: 15px; color: #38bdf8; font-weight: 600; }
        
        .toggle-btn {
            background: #1e293b;
            border: 1px solid #475569;
            color: #e2e8f0;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .toggle-btn:hover {
            background: #334155;
            border-color: #38bdf8;
            color: #38bdf8;
        }
        
        .panel-content {
            padding: 12px 14px 14px 14px;
            max-height: calc(92vh - 55px);
            overflow-y: auto;
        }
        
        .control-group { margin-bottom: 12px; }
        .control-group label {
            display: block; font-size: 12px; color: #94a3b8;
            margin-bottom: 4px; font-weight: 500;
        }
        select, button.action-btn {
            width: 100%; padding: 8px 10px; border-radius: 6px;
            border: 1px solid #475569; background: #1e293b;
            color: #f1f5f9; font-size: 13px; cursor: pointer;
        }
        select:hover, button.action-btn:hover { border-color: #38bdf8; }
        button.action-btn {
            background: #0ea5e9; border-color: #0ea5e9; font-weight: 600; margin-top: 4px;
        }
        button.action-btn:hover { background: #0284c7; }
        button.secondary {
            background: #334155; border-color: #475569; color: #f1f5f9;
            padding: 8px 10px; border-radius: 6px; border: 1px solid #475569;
            font-size: 13px; cursor: pointer; width: 100%;
        }
        button.secondary:hover { background: #475569; }
        .btn-row { display: flex; gap: 6px; margin-top: 6px; }
        .btn-row button { flex: 1; }
        
        .status {
            font-size: 11px; color: #64748b; margin-top: 12px; line-height: 1.45;
            border-top: 1px solid #334155; padding-top: 10px;
        }
        .status span { color: #22c55e; }
        
        .alert-box {
            background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444;
            border-radius: 8px; padding: 8px 10px; margin-top: 10px;
            font-size: 12px; max-height: 120px; overflow-y: auto;
        }
        .alert-box strong { color: #f87171; }
        .alert-item { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid rgba(239,68,68,0.2); }
        .alert-item:last-child { border-bottom: none; margin-bottom: 0; }
        
        .temp-marker {
            background: rgba(15, 23, 42, 0.9); border: 2px solid #38bdf8; border-radius: 50%;
            color: #fff; font-weight: 700; font-size: 12px; text-align: center;
            line-height: 30px; width: 34px !important; height: 34px !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .temp-marker.hot  { border-color: #ef4444; background: rgba(127, 29, 29, 0.92); }
        .temp-marker.warm { border-color: #f97316; }
        .temp-marker.cool { border-color: #3b82f6; }
        .temp-marker.cold { border-color: #06b6d4; background: rgba(8, 47, 73, 0.92); }
        
        .city-label {
            background: transparent; border: none; color: #e2e8f0; font-weight: 600;
            font-size: 11px; text-shadow: 0 0 4px #000, 0 0 4px #000, 1px 1px 2px #000; white-space: nowrap;
        }
        .city-label.major { font-size: 13px; font-weight: 700; color: #f8fafc; }
        
        .legend {
            position: absolute; bottom: 22px; left: 12px; z-index: 1000;
            background: rgba(15, 23, 42, 0.9); border: 1px solid #334155;

        }
    </style>
</head>

    function initMap() {
        map = L.map('map', {
            center: CONFIG.defaultCenter, zoom: CONFIG.defaultZoom,
            minZoom: CONFIG.minZoom, maxZoom: CONFIG.maxZoom
        });

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri', maxZoom: 19
        }).addTo(map);

        cityLayerGroup = L.layerGroup().addTo(map);
        tempLayerGroup = L.layerGroup().addTo(map);
        alertLayerGroup = L.layerGroup().addTo(map);

        updateCityLabels();
        map.on('zoomend moveend', () => {
            updateCityLabels();
            if (tempFetchTimeout) clearTimeout(tempFetchTimeout);
            tempFetchTimeout = setTimeout(fetchTemperaturesForView, 700);
        });

        // Stronger minimize / expand handling
        const toggleBtn = document.getElementById('toggleBtn');
        const panelHeader = document.getElementById('panelHeader');
        const controlPanel = document.getElementById('controlPanel');

        toggleBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            togglePanel();
        });

        panelHeader.addEventListener('click', function(e) {
            // Allow clicking the header area to toggle when minimized
            if (panelMinimized) {
                e.preventDefault();
                togglePanel();
            }
        });

        document.getElementById('satSelect').addEventListener('change', updateSatellite);
        document.getElementById('radarSelect').addEventListener('change', () => {
            if (document.getElementById('radarSelect').value === 'off') {
                stopRadarLoop();
                if (radarLayer) { map.removeLayer(radarLayer); radarLayer = null; }
                document.getElementById('radarStatus').textContent = 'Off';
                document.getElementById('radarTime').textContent = 'Radar: Off';
            } else loadRadarFrames();
        });
        document.getElementById('tempSelect').addEventListener('change', () => {
            if (document.getElementById('tempSelect').value === 'on') fetchTemperaturesForView();
            else { tempLayerGroup.clearLayers(); document.getElementById('tempStatus').textContent = 'Off'; }
        });
        document.getElementById('alertSelect').addEventListener('change', () => {
            if (document.getElementById('alertSelect').value === 'on') fetchAlerts();
            else {
                alertLayerGroup.clearLayers();
                document.getElementById('alertBox').style.display = 'none';
                document.getElementById('alertStatus').textContent = 'Off';
            }
        });

        document.getElementById('playBtn').addEventListener('click', startRadarLoop);
        document.getElementById('pauseBtn').addEventListener('click', stopRadarLoop);
        document.getElementById('refreshBtn').addEventListener('click', () => {
            fetchTemperaturesForView(); loadRadarFrames(); fetchAlerts(); updateSatellite();
        });

        fetchTemperaturesForView();
        loadRadarFrames();
        fetchAlerts();
        updateSatellite();

        setInterval(fetchTemperaturesForView, CONFIG.tempRefreshMs);
        setInterval(loadRadarFrames, CONFIG.radarRefreshMs);
        setInterval(fetchAlerts, CONFIG.alertRefreshMs);
    }

    function togglePanel() {
        const panel = document.getElementById('controlPanel');
        const btn = document.getElementById('toggleBtn');
        
        panelMinimized = !panelMinimized;
        
        if (panelMinimized) {
            panel.classList.add('minimized');
            btn.textContent = '+';
            btn.title = 'Expand menu';
        } else {
            panel.classList.remove('minimized');
            btn.textContent = '−';
            btn.title = 'Minimize menu';
        }
    }

    function updateCityLabels() {
        cityLayerGroup.clearLayers();
        const zoom = map.getZoom();
        CITIES.forEach(city => {
            if (city.tier === 1 || (city.tier === 2 && zoom >= 6)) {
                const icon = L.divIcon({
                    className: 'city-label' + (city.tier === 1 ? ' major' : ''),
                    html: city.name, iconSize: [0,0], iconAnchor: [0,0]
                });
                L.marker([city.lat, city.lon], {icon, interactive:false}).addTo(cityLayerGroup);
            }
        });
    }

    async function fetchTemperaturesForView() {
        if (document.getElementById('tempSelect').value !== 'on') return;
        document.getElementById('tempStatus').textContent = 'Updating...';
        tempLayerGroup.clearLayers();

        const bounds = map.getBounds().pad(0.25);
        let candidates = STATIONS.filter(s => bounds.contains([s.lat, s.lon]));

        if (candidates.length > CONFIG.maxTempsToFetch) {
            const center = map.getCenter();
            candidates.sort((a, b) => {
                return Math.hypot(a.lat - center.lat, a.lon - center.lng) -
                       Math.hypot(b.lat - center.lat, b.lon - center.lng);
            });
            candidates = candidates.slice(0, CONFIG.maxTempsToFetch);
        }

        if (candidates.length === 0) {
            document.getElementById('tempStatus').textContent = '0 in view';
            return;
        }

        let success = 0;
        const promises = candidates.map(async (station) => {
            try {
                const resp = await fetch(`https://api.weather.gov/stations/${station.id}/observations/latest`, {
                    headers: { 'User-Agent': CONFIG.userAgent, 'Accept': 'application/geo+json' }
                });
                if (!resp.ok) return null;
                const data = await resp.json();
                const props = data.properties;
                if (!props || props.temperature.value === null) return null;
                const tempC = props.temperature.value;
                const tempF = Math.round(tempC * 9/5 + 32);
                return { station, tempF, tempC: Math.round(tempC), timestamp: props.timestamp, text: props.textDescription || '' };
            } catch(e) { return null; }
        });

        const results = await Promise.all(promises);
        results.forEach(r => {
            if (!r) return;
            success++;
            let cls = 'temp-marker';
            if (r.tempF >= 90) cls += ' hot';
            else if (r.tempF >= 70) cls += ' warm';
            else if (r.tempF >= 40) cls += ' cool';
            else cls += ' cold';
            const icon = L.divIcon({ className: cls, html: r.tempF + '°', iconSize: [34,34], iconAnchor: [17,17] });
            L.marker([r.station.lat, r.station.lon], {icon})
                .bindPopup(`<strong>${r.station.name}</strong><br>${r.tempF}°F (${r.tempC}°C)<br>${r.text}<br><small>${new Date(r.timestamp).toLocaleString()}</small>`)
                .addTo(tempLayerGroup);
        });

        document.getElementById('tempStatus').textContent = success + ' in view';
        document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
    }

    async function loadRadarFrames() {
        if (document.getElementById('radarSelect').value !== 'on') return;
        try {
            const resp = await fetch('https://api.rainviewer.com/public/weather-maps.json');
            const api = await resp.json();
            if (!api.radar?.past?.length) {
                document.getElementById('radarStatus').textContent = 'No data';
                return;
            }
            rainviewerHost = api.host || rainviewerHost;
            radarFrames = api.radar.past.slice(-CONFIG.radarFramesToKeep);
            currentFrameIndex = radarFrames.length - 1;
            showRadarFrame(currentFrameIndex);
            document.getElementById('radarStatus').textContent = radarFrames.length + ' frames';
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
        } catch(e) {
            document.getElementById('radarStatus').textContent = 'Error';
        }
    }

    function showRadarFrame(index) {
        if (!radarFrames.length) return;
        index = Math.max(0, Math.min(index, radarFrames.length - 1));
        currentFrameIndex = index;
        const frame = radarFrames[index];
        const url = rainviewerHost + frame.path + '/256/{z}/{x}/{y}/2/1_1.png';
        if (radarLayer) map.removeLayer(radarLayer);
        radarLayer = L.tileLayer(url, {
            opacity: CONFIG.radarOpacity, zIndex: 200, maxNativeZoom: 7, maxZoom: 12
        }).addTo(map);
        document.getElementById('radarTime').textContent = 'Radar: ' + new Date(frame.time * 1000).toLocaleTimeString();
        document.getElementById('radarStatus').textContent = (index+1) + '/' + radarFrames.length;
    }

    function startRadarLoop() {
        if (radarPlaying || radarFrames.length < 2) return;
        radarPlaying = true;
        document.getElementById('playBtn').style.opacity = '0.5';
        radarTimer = setInterval(() => {
            currentFrameIndex = (currentFrameIndex + 1) % radarFrames.length;
            showRadarFrame(currentFrameIndex);
        }, 700);
    }

    function stopRadarLoop() {
        radarPlaying = false;
        if (radarTimer) clearInterval(radarTimer);
        radarTimer = null;
        document.getElementById('playBtn').style.opacity = '1';
    }

    async function fetchAlerts() {
        if (document.getElementById('alertSelect').value !== 'on') return;
        document.getElementById('alertStatus').textContent = 'Updating...';
        alertLayerGroup.clearLayers();
        try {
            const resp = await fetch('https://api.weather.gov/alerts/active?status=actual&message_type=alert', {
                headers: { 'User-Agent': CONFIG.userAgent, 'Accept': 'application/geo+json' }
            });
            if (!resp.ok) throw new Error('fail');
            const data = await resp.json();
            const features = data.features || [];
            const important = features.filter(f => {
                const e = (f.properties.event || '').toLowerCase();
                return e.includes('warning') || e.includes('watch') || e.includes('tornado') ||
                       e.includes('severe') || e.includes('hurricane') || e.includes('blizzard');
            }).slice(0, 40);

            let shown = 0;
            important.forEach(f => {
                try {
                    if (!f.geometry) return;
                    const props = f.properties;
                    const color = (props.event || '').toLowerCase().includes('warning') ? '#ef4444' : '#f59e0b';
                    L.geoJSON(f.geometry, {
                        style: { color, weight: 2, opacity: 0.8, fillOpacity: 0.15 }
                    }).bindPopup(`<strong>${props.event}</strong><br>${props.headline || ''}<br><small>${props.areaDesc || ''}</small>`)
                      .addTo(alertLayerGroup);
                    shown++;
                } catch(e) {}
            });

            const box = document.getElementById('alertBox');
            if (important.length > 0) {
                box.style.display = 'block';
                box.innerHTML = '<strong>Active Alerts</strong><br>' +
                    important.slice(0, 6).map(f =>
                        `<div class="alert-item">${f.properties.event}<br><small>${(f.properties.areaDesc||'').substring(0,55)}...</small></div>`
                    ).join('');
            } else box.style.display = 'none';

            document.getElementById('alertStatus').textContent = shown + ' shown';
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
        } catch(e) {
            document.getElementById('alertStatus').textContent = 'Error';
        }
    }

    function updateSatellite() {
        const choice = document.getElementById('satSelect').value;
        if (satLayer) { map.removeLayer(satLayer); satLayer = null; }
        if (choice === 'none') return;
        let wmsUrl, layers;
        if (choice === 'visible') {
            wmsUrl = 'https://mesonet.agron.iastate.edu/cgi-bin/wms/goes/conus_vis.cgi?';
            layers = 'conus_vis_1km';
        } else {
            wmsUrl = 'https://mesonet.agron.iastate.edu/cgi-bin/wms/goes/conus_ir.cgi?';
            layers = 'conus_ir_4km';
        }
        satLayer = L.tileLayer.wms(wmsUrl, {
            layers, format: 'image/png', transparent: true,
            opacity: CONFIG.satelliteOpacity, attribution: 'Satellite © Iowa State / NOAA GOES', zIndex: 100
        }).addTo(map);
    }

    document.addEventListener('DOMContentLoaded', initMap);
    </script>
