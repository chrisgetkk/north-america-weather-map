name: Fetch HRRR Model

on:
  schedule:
    # Hourly at :35 UTC — after typical HRRR publish lag
    - cron: "35 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch HRRR
        env:
          STORMVISTA_APIKEY: ${{ secrets.STORMVISTA_APIKEY }}
        run: python scripts/scripts/fetch_hrrr.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add data/hrrr-hourly.json data/hrrr-raw-sample.txt || true
          git diff --staged --quiet || git commit -m "Update HRRR $(date -u +%Y-%m-%dT%H%M)"
          git push
