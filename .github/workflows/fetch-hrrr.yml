name: Fetch HRRR Model

on:
  schedule:
    # Hourly at :35 UTC — after typical HRRR publish lag
    - cron: "35 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch HRRR
        env:
          STORMVISTA_APIKEY: ${{ secrets.STORMVISTA_APIKEY }}
        run: python scripts/scripts/fetch_hrrr.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add data/rrfs-hourly.json data/rrfs-raw-sample.txt || true
          git commit -m "Update RRFS $(date -u +%Y-%m-%dT%H%M)" || echo "No RRFS changes to commit"
          git pull --rebase --autostash origin main
          git push
