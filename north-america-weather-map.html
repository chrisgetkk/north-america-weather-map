          crossorigin=""/>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #1a1a2e; 
            color: #eee;
            height: 100vh;
            overflow: hidden;
        }
        #map { 
            width: 100%; 
            height: 100%; 
            background: #0f172a;
        }
        
        /* Control Panel */
        .control-panel {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px 16px;
            width: 280px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
        }
        .control-panel h2 {
            font-size: 15px;
            margin-bottom: 12px;
            color: #38bdf8;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .control-group {
            margin-bottom: 12px;
        }
        .control-group label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 500;
        }
        select, button {
            width: 100%;
            padding: 7px 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #1e293b;
            color: #f1f5f9;
            font-size: 13px;
            cursor: pointer;
        }
        select:hover, button:hover {
            border-color: #38bdf8;
        }
        button {
            background: #0ea5e9;
            border-color: #0ea5e9;
            font-weight: 600;
            margin-top: 4px;
        }
        button:hover {
            background: #0284c7;
        }
        .status {
            font-size: 11px;
            color: #64748b;
            margin-top: 10px;
            line-height: 1.4;
            border-top: 1px solid #334155;
            padding-top: 8px;
        }
        .status span {
            color: #22c55e;
        }
        
        /* Temperature markers */
        .temp-marker {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #38bdf8;
            border-radius: 50%;
            color: #fff;
            font-weight: 700;
            font-size: 12px;
            text-align: center;
            line-height: 28px;
            width: 32px !important;
            height: 32px !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .temp-marker.hot { border-color: #ef4444; background: rgba(127, 29, 29, 0.9); }
        .temp-marker.warm { border-color: #f97316; }
        .temp-marker.cool { border-color: #3b82f6; }
        .temp-marker.cold { border-color: #06b6d4; background: rgba(8, 47, 73, 0.9); }
        
        /* City labels */
        .city-label {
            background: transparent;
            border: none;
            color: #e2e8f0;
            font-weight: 600;
            font-size: 11px;
            text-shadow: 0 0 4px #000, 0 0 4px #000, 1px 1px 2px #000;
            white-space: nowrap;
        }
        .city-label.major {
            font-size: 13px;
            font-weight: 700;
            color: #f8fafc;
        }
        
        /* Legend */
        .legend {
            position: absolute;
            bottom: 24px;
            left: 12px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 11px;
            color: #94a3b8;
        }
        
        /* Attribution tweak */
        .leaflet-control-attribution {
            background: rgba(15, 23, 42, 0.8) !important;
            color: #64748b !important;
            font-size: 10px !important;
        }
        .leaflet-control-attribution a { color: #38bdf8 !important; }

    // ============================================================

    let map;

    // ============================================================
    // INITIALIZE MAP
    // ============================================================
    function initMap() {
        map = L.map('map', {
            center: CONFIG.defaultCenter,
            zoom: CONFIG.defaultZoom,
            minZoom: CONFIG.minZoom,
            maxZoom: CONFIG.maxZoom,
            zoomControl: true
        });
        
        // Base map - Esri World Street Map (free public tiles, works from local files)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 19
        }).addTo(map);
        
        cityLayerGroup = L.layerGroup().addTo(map);
        tempLayerGroup = L.layerGroup().addTo(map);
        
        // Progressive city labels
        updateCityLabels();
        map.on('zoomend', updateCityLabels);
        
        // Wire up controls
        document.getElementById('satSelect').addEventListener('change', updateSatellite);
        document.getElementById('radarSelect').addEventListener('change', updateRadar);
        document.getElementById('tempSelect').addEventListener('change', () => {
            if (document.getElementById('tempSelect').value === 'on') {
                fetchTemperatures();
            } else {
                tempLayerGroup.clearLayers();
                document.getElementById('tempStatus').textContent = 'Off';
            }
        });
        document.getElementById('refreshBtn').addEventListener('click', () => {
            fetchTemperatures();
            updateRadar(true);
            updateSatellite();
        });
        
        // Initial data load
        fetchTemperatures();
        updateRadar(true);
        updateSatellite();
        
        // Auto-refresh timers
        setInterval(fetchTemperatures, CONFIG.tempRefreshMs);
        setInterval(() => updateRadar(true), CONFIG.radarRefreshMs);
        setInterval(updateSatellite, CONFIG.radarRefreshMs);
    }
    
    // ============================================================
    // PROGRESSIVE CITY LABELS
    // ============================================================
    function updateCityLabels() {
        cityLayerGroup.clearLayers();
        const zoom = map.getZoom();
        
        CITIES.forEach(city => {
            // Tier logic: higher zoom shows more cities
            if (city.tier === 1 || (city.tier === 2 && zoom >= 6) || (city.tier >= 3 && zoom >= 8)) {
                const icon = L.divIcon({
                    className: 'city-label' + (city.tier === 1 ? ' major' : ''),
                    html: city.name,
                    iconSize: [0, 0],
                    iconAnchor: [0, 0]
                });
                L.marker([city.lat, city.lon], {icon: icon, interactive: false}).addTo(cityLayerGroup);
            }
        });
    }
    
    // ============================================================
    // NWS TEMPERATURES
    // ============================================================
    async function fetchTemperatures() {
        if (document.getElementById('tempSelect').value !== 'on') return;
        
        document.getElementById('tempStatus').textContent = 'Updating...';
        tempLayerGroup.clearLayers();
        
        let successCount = 0;
        
        // Fetch a reasonable number of stations (avoid hammering the API)
        const toFetch = STATIONS.slice(0, 40); // limit concurrent
        
        const promises = toFetch.map(async (station) => {
            try {
                const url = `https://api.weather.gov/stations/${station.id}/observations/latest`;
                const resp = await fetch(url, {
                    headers: {
                        'User-Agent': CONFIG.userAgent,
                        'Accept': 'application/geo+json'
                    }
                });
                if (!resp.ok) return null;
                const data = await resp.json();
                const props = data.properties;
                if (!props || props.temperature.value === null) return null;
                
                // Convert C to F
                const tempC = props.temperature.value;
                const tempF = Math.round(tempC * 9/5 + 32);
                
                return {
                    station,
                    tempF,
                    tempC: Math.round(tempC),
                    timestamp: props.timestamp,
                    text: props.textDescription || ''
                };
            } catch (e) {
                return null;
            }
        });
        
        const results = await Promise.all(promises);
        
        results.forEach(r => {
            if (!r) return;
            successCount++;
            
            let cls = 'temp-marker';
            if (r.tempF >= 90) cls += ' hot';
            else if (r.tempF >= 70) cls += ' warm';
            else if (r.tempF >= 40) cls += ' cool';
            else cls += ' cold';
            
            const icon = L.divIcon({
                className: cls,
                html: r.tempF + '°',
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });
            
            const marker = L.marker([r.station.lat, r.station.lon], {icon: icon})
                .bindPopup(`<strong>${r.station.name}</strong><br>
                            ${r.tempF}°F (${r.tempC}°C)<br>
                            ${r.text}<br>
                            <small>${new Date(r.timestamp).toLocaleString()}</small>`);
            marker.addTo(tempLayerGroup);
        });
        
        document.getElementById('tempStatus').textContent = `${successCount} stations`;
        document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
    }
    
    // ============================================================
    // RADAR (RainViewer)
    // ============================================================
    async function updateRadar(force = false) {
        if (document.getElementById('radarSelect').value !== 'on') {
            if (radarLayer) {
                map.removeLayer(radarLayer);
                radarLayer = null;
            }
            document.getElementById('radarStatus').textContent = 'Off';
            return;
        }
        
        try {
            const resp = await fetch('https://api.rainviewer.com/public/weather-maps.json');
            const api = await resp.json();
            
            if (!api.radar || !api.radar.past || api.radar.past.length === 0) {
                document.getElementById('radarStatus').textContent = 'No data';
                return;
            }
            
            // Use the most recent past frame
            const latest = api.radar.past[api.radar.past.length - 1];
            const path = latest.path;
            
            if (!force && path === lastRadarPath && radarLayer) {
                document.getElementById('radarStatus').textContent = 'Up to date';
                return;
            }
            lastRadarPath = path;
            
            if (radarLayer) {
                map.removeLayer(radarLayer);
            }
            
            // RainViewer tile URL pattern
            // color=2 (Universal Blue), options=1_1 (smooth + snow)
            radarLayer = L.tileLayer(api.host + path + '/256/{z}/{x}/{y}/2/1_1.png', {
                opacity: CONFIG.radarOpacity,
                zIndex: 200,
                maxNativeZoom: 7,   // free tier limit
                maxZoom: 12
            }).addTo(map);
            
            const timeStr = new Date(latest.time * 1000).toLocaleTimeString();
            document.getElementById('radarStatus').textContent = timeStr;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
        } catch (e) {
            console.error('Radar error', e);
            document.getElementById('radarStatus').textContent = 'Error';
        }
    }
    
    // ============================================================
    // SATELLITE (Iowa State Mesonet GOES WMS - free & reliable)
    // ============================================================
    function updateSatellite() {
        const choice = document.getElementById('satSelect').value;
        
        if (satLayer) {
            map.removeLayer(satLayer);
            satLayer = null;
        }
        
        if (choice === 'none') return;
        
        // Iowa State Mesonet provides excellent free GOES WMS
        // Visible (daytime clouds) and Infrared (cloud tops day/night)
        let wmsUrl, layers;
        
        if (choice === 'visible') {
            // GOES East + West visible composite-ish via available layers
            // Using the well-known GOES East CONUS visible as primary
            wmsUrl = 'https://mesonet.agron.iastate.edu/cgi-bin/wms/goes/conus_vis.cgi?';
            layers = 'conus_vis_1km';
        } else if (choice === 'infrared') {
            wmsUrl = 'https://mesonet.agron.iastate.edu/cgi-bin/wms/goes/conus_ir.cgi?';
            layers = 'conus_ir_4km';
        }
        
        if (wmsUrl) {
            satLayer = L.tileLayer.wms(wmsUrl, {
                layers: layers,
                format: 'image/png',
                transparent: true,
                opacity: CONFIG.satelliteOpacity,
                attribution: 'Satellite © Iowa State Mesonet / NOAA GOES',
                zIndex: 100
            }).addTo(map);
        }
    }
    
    // ============================================================
    // START EVERYTHING
    // ============================================================
    document.addEventListener('DOMContentLoaded', initMap);
    </script>
</body>
</html>
